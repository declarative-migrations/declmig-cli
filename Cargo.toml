[package]
name = "declmig-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CLI for Declarative Migrations"
repository = "https://github.com/declarative-migrations/declmig-cli"

[[bin]]
name = "declmig"
path = "src/main.rs"

[dependencies]
ores-clis-core = { git = "https://github.com/ORESoftware/ores-clis-core.git", rev = "5563aae9a95d2ab4f4116723e5a1939fadcfbf8c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
